<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Sesle Görselleştirme</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #040611; color: #eef7ff;
    font-family: system-ui, Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #exit {
    position: fixed;
    left: calc(14px + env(safe-area-inset-left));
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(10, 15, 35, .55);
    color: #eaf7ff;
    display: grid; place-items: center;
    padding: 0;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 5;
  }
  #exit:active { background: rgba(255, 90, 110, .45); }
  #exit svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<canvas id="visual"></canvas>

<button id="exit" aria-label="Çıkış">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>

<script>
(() => {
  const canvas = document.getElementById('visual');
  const ctx = canvas.getContext('2d');

  const MODES = ['aurora','bars','orbit','mandala','spiral','tunnel','wave','kaleido','rings','starfield','lissajous','plasma'];
  let modeIdx = 0;

  let data = null;
  let lastData = 0;
  let active = false;
  let smooth = 0;
  let phase = 0;
  let particles = [];
  let w = 0, h = 0, dpr = 1;

  // Android'den gelen FFT verisi (1024 bin, 0-255, base64)
  window.pushAudio = (b64) => {
    const bin = atob(b64);
    if (!data || data.length !== bin.length) data = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
    lastData = performance.now();
    active = true;
  };

  document.getElementById('exit').addEventListener('click', () => {
    if (window.Android) Android.exit();
  });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    particles = Array.from({
      length: Math.max(80, Math.min(160, Math.floor(w * h / 9000)))
    }, () => ({
      a: Math.random() * Math.PI * 2,
      r: Math.random() * Math.min(w, h) * .48,
      speed: (Math.random() - .5) * .012,
      size: Math.random() * 2 + 0.4,
      hue: Math.random() * 100 + 170
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  // 60 sn'de bir rastgele farklı mod
  setInterval(() => {
    let n;
    do { n = Math.floor(Math.random() * MODES.length); } while (n === modeIdx);
    modeIdx = n;
  }, 60000);

  // Veri 1 sn kesilirse (ses yok) durgun animasyona dön
  setInterval(() => { if (active && performance.now() - lastData > 1000) active = false; }, 500);

  function draw() {
    requestAnimationFrame(draw);

    let level = 0;
    let bins = null;

    if (active && data) {
      bins = data;
      let sum = 0;
      const n = 90;
      for (let i = 0; i < n; i++) sum += data[i];
      level = sum / (n * 255);
      smooth = smooth * .78 + level * .22;
    } else {
      smooth *= .985;
    }

    phase += .006 + smooth * .08;

    ctx.fillStyle = 'rgba(3,6,19,0.22)';
    ctx.fillRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h * .55;
    const base = Math.min(w, h) * (.12 + smooth * .08);

    const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.max(w, h) * .65);
    glow.addColorStop(0, `rgba(35,90,190,${.06 + smooth * .2})`);
    glow.addColorStop(1, 'rgba(2,4,15,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    const chosen = MODES[modeIdx];
    const valueAt = (i) => bins ? bins[Math.abs(i * 7) % bins.length] / 255 : .12 + .08 * Math.sin(phase + i * .17);
    const hueBase = 185 + smooth * 100;

    if (chosen === 'bars') {
      const count = Math.min(120, Math.floor(w / 6));
      const step = Math.max(1, Math.floor((bins ? bins.length : 256) / count));

      for (let i = 0; i < count; i++) {
        const v = bins ? bins[i * step] / 255 : (.05 + .035 * Math.sin(phase + i * .22));
        const bh = 8 + v * h * .42;
        const x = i * w / count;
        const hue = (180 + i / count * 150 + phase * 12) % 360;
        const grad = ctx.createLinearGradient(0, cy - bh, 0, cy + bh);
        grad.addColorStop(0, `hsla(${hue},95%,72%,.95)`);
        grad.addColorStop(1, `hsla(${hue + 30},95%,50%,.12)`);
        ctx.fillStyle = grad;
        ctx.fillRect(x, cy - bh / 2, Math.max(2, w / count - 2), bh);
      }

      ctx.strokeStyle = '#7defff66';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(w, cy);
      ctx.stroke();
    } else if (chosen === 'orbit' || chosen === 'starfield') {
      particles.forEach((p, i) => {
        const v = valueAt(i);
        p.a += p.speed * (1 + v * 8);
        const r = chosen === 'starfield'
          ? (p.r + phase * 18 * (.3 + v)) % (Math.max(w, h) * .65)
          : p.r * (.6 + v * .8);
        const x = cx + Math.cos(p.a + phase * .2) * r;
        const y = cy + Math.sin(p.a + phase * .2) * r * .65;
        ctx.beginPath();
        ctx.arc(x, y, p.size + v * 4, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue + v * 100},100%,70%,${.3 + v * .7})`;
        ctx.fill();
      });

      ctx.beginPath();
      ctx.arc(cx, cy, base * (1 + smooth * 3), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(91,228,255,${.25 + smooth})`;
      ctx.lineWidth = 1.5 + smooth * 5;
      ctx.stroke();
    } else if (chosen === 'mandala' || chosen === 'kaleido') {
      const petals = chosen === 'mandala' ? 12 : 8;
      const radius = Math.min(w, h) * (.13 + smooth * .18);

      for (let layer = 0; layer < 5; layer++) {
        const r = radius * (.42 + layer * .29);
        const rot = phase * (layer % 2 ? -.5 : .7) + layer * .22;

        for (let j = 0; j < petals; j++) {
          const a = j * Math.PI * 2 / petals + rot;
          const v = valueAt(j + layer * 13);
          const rr = r * (.8 + v * 1.1);
          const x = cx + Math.cos(a) * rr;
          const y = cy + Math.sin(a) * rr;

          ctx.beginPath();
          ctx.ellipse(x, y, rr * (chosen === 'kaleido' ? .28 : .22), rr * (.12 + v * .12), a, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hueBase + j * 360 / petals + layer * 24},100%,${60 + v * 25}%,${.35 + v * .55})`;
          ctx.lineWidth = 1 + v * 2;
          ctx.shadowBlur = 12 + v * 18;
          ctx.shadowColor = '#57dfff';
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }
    } else if (chosen === 'spiral' || chosen === 'tunnel') {
      const turns = chosen === 'spiral' ? 7 : 12;
      const maxR = Math.min(w, h) * .72;

      for (let arm = 0; arm < (chosen === 'spiral' ? 3 : 2); arm++) {
        ctx.beginPath();

        for (let t = 0; t < turns * Math.PI * 2; t += .035) {
          const r = chosen === 'spiral'
            ? 3 + t * maxR / (turns * Math.PI * 2)
            : (t / (turns * Math.PI * 2)) * maxR;
          const a = t + phase * (arm % 2 ? -.8 : 1) + arm * Math.PI;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r * (.65 + smooth * .25);
          if (t === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.strokeStyle = `hsla(${hueBase + arm * 110 + phase * 8},100%,68%,${.45 + smooth * .45})`;
        ctx.lineWidth = 1.2 + smooth * 3;
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#4beaff';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    } else if (chosen === 'rings') {
      for (let i = 0; i < 22; i++) {
        const r = (i * 17 + phase * 25 * (i % 2 ? 1 : -1) + Math.min(w, h) * .15) % (Math.min(w, h) * .65);
        ctx.beginPath();
        ctx.ellipse(cx, cy, r, r * (.55 + smooth * .4), phase * .15 + i * .05, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${hueBase + i * 16},100%,68%,${.18 + (i % 5) * .12 + smooth * .4})`;
        ctx.lineWidth = 1 + valueAt(i) * 3;
        ctx.stroke();
      }
    } else if (chosen === 'lissajous') {
      for (let k = 1; k <= 9; k++) {
        ctx.beginPath();
        for (let t = 0; t <= Math.PI * 2 + .02; t += .008) {
          const amp = Math.min(w, h) * (.12 + smooth * .14);
          const x = cx + Math.sin(t * k / 3 + phase) * amp * (1 + valueAt(k) * .3);
          const y = cy + Math.sin(t * (k % 5 + 2) + phase * .7) * amp;
          if (t === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `hsla(${hueBase + k * 29},100%,68%,.48)`;
        ctx.lineWidth = 1 + smooth * 2;
        ctx.stroke();
      }
    } else if (chosen === 'plasma') {
      for (let i = 0; i < 70; i++) {
        const x = (i * 97 + Math.sin(phase + i) * w * .08) % w;
        const y = (i * 53 + Math.cos(phase * .8 + i * 1.7) * h * .12 + h) % h;
        const r = 15 + valueAt(i) * 100 + smooth * 90;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `hsla(${hueBase + i * 13},100%,65%,${.05 + smooth * .12})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      for (let ring = 0; ring < 7; ring++) {
        ctx.beginPath();
        for (let x = 0; x <= w; x += 3) {
          const idx = Math.min(bins ? bins.length - 1 : 0, Math.floor(x / Math.max(1, w) * (bins ? bins.length : 1) * .35));
          const v = bins ? bins[idx] / 255 : 0;
          const amp = 12 + smooth * 100 + v * 70;
          const y = cy + Math.sin(x * .008 + phase + ring * .8) * amp + Math.sin(x * .017 - phase * .8 + ring) * amp * .35;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `hsla(${180 + ring * 27 + smooth * 70},100%,${65 + ring * 3}%,${.3 + ring * .09 + smooth * .4})`;
        ctx.lineWidth = 1.2 + ring * .35 + smooth * 2;
        ctx.shadowBlur = 12 + smooth * 24;
        ctx.shadowColor = '#35dfff';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      particles.forEach((p, i) => {
        const v = valueAt(i);
        p.a += p.speed * (1 + v * 5);
        const rr = p.r * (.45 + smooth * 1.3);
        const x = cx + Math.cos(p.a + phase * .15) * rr;
        const y = cy + Math.sin(p.a + phase * .15) * rr * .6;
        ctx.fillStyle = `hsla(${p.hue + v * 100},100%,75%,${.2 + v * .65})`;
        ctx.fillRect(x, y, p.size + v * 2, p.size + v * 2);
      });
    }

    const pulse = 7 + smooth * 36 + Math.sin(phase * 2) * 2;
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse * 2.7);
    core.addColorStop(0, `rgba(220,255,255,${.65 + smooth * .3})`);
    core.addColorStop(.25, `rgba(67,210,255,${.2 + smooth * .5})`);
    core.addColorStop(1, 'rgba(50,80,255,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, pulse * 2.7, 0, Math.PI * 2);
    ctx.fill();
  }


  ctx.fillStyle = '#050713';
  ctx.fillRect(0, 0, w, h);
  draw();
})();
</script>
</body>
</html>
